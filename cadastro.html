<script>

// AUTOCOMPLETE DE ENDEREÇO — BUSCA DIRETA NA TABELA ruas
let ruas = [];
let ruaSelecionada = null;
let buscaRuasTimer = null;
let ultimaBuscaRuas = "";

function montarEndereco(rua) {
    return [rua["TIPO"], rua["COMPLEMENTO DO NOME"], rua["NOME"]]
        .filter(valor => valor !== null && valor !== undefined && String(valor).trim() !== "")
        .map(valor => String(valor).trim())
        .join(" ");
}

function normalizar(texto) {
    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

function escaparHtml(texto) {
    return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

const input = document.getElementById("rua");
const lista = document.getElementById("lista");
const bairro = document.getElementById("bairro");

function limparListaRuas() {
    if (lista) lista.innerHTML = "";
}

function selecionarRua(rua) {
    ruaSelecionada = rua;
    ruas = [rua, ...ruas.filter(r => String(r.id) !== String(rua.id))];
    input.value = montarEndereco(rua);
    bairro.value = rua["BAIRRO"] || "";
    limparListaRuas();
}

function mostrarSugestoesRuas(resultados) {
    limparListaRuas();
    if (!resultados.length) {
        lista.innerHTML = '<div style="color:#777;cursor:default;">Nenhuma rua encontrada.</div>';
        return;
    }

    resultados.forEach(rua => {
        const div = document.createElement("div");
        const endereco = montarEndereco(rua) || rua["NOME COMPLETO"] || "Rua sem nome";
        const identificador = rua["NÚMERO DA RUA"] !== null && rua["NÚMERO DA RUA"] !== undefined && rua["NÚMERO DA RUA"] !== ""
            ? `Nº da rua: ${rua["NÚMERO DA RUA"]}`
            : "";
        div.innerHTML = `<strong>${escaparHtml(endereco)}</strong><br><small>${escaparHtml(rua["BAIRRO"] || "Bairro não informado")} ${escaparHtml(identificador)}</small>`;
        div.addEventListener("mousedown", event => {
            event.preventDefault();
            selecionarRua(rua);
        });
        lista.appendChild(div);
    });
}

async function buscarRuasNoBanco(texto) {
    const termo = String(texto || "").trim();
    if (!termo) {
        limparListaRuas();
        return;
    }

    const termoNormalizado = normalizar(termo);
    if (termoNormalizado === ultimaBuscaRuas) return;
    ultimaBuscaRuas = termoNormalizado;

    try {
        // IMPORTANTE: ruas fica em OUTRO projeto Supabase.
        // O cadastro de OS continua no Banco 1.
        const campos = 'id,"NÚMERO DA RUA","TIPO","COMPLEMENTO DO NOME","NOME","NOME COMPLETO","BAIRRO","CEP","COORDENADAS"';
        const termoUrl = encodeURIComponent(termo).replace(/%20/g, " ");
        let filtro;

        // A BUSCA DO ENDEREÇO É FEITA EXCLUSIVAMENTE PELA COLUNA "NOME"
        // da tabela public.ruas no BANCO 2.
        // "NÚMERO DA RUA" não é usado como filtro.
        filtro = `NOME=ilike.*${termoUrl}*`;

        const url = `${SUPABASE_RUAS_URL}/rest/v1/ruas?select=${campos}&${filtro}&order=NOME.asc&limit=15`;
        const resposta = await fetch(url, {
            method: "GET",
            mode: "cors",
            credentials: "omit",
            headers: {
                "apikey": SUPABASE_RUAS_PUBLISHABLE_KEY,
                "Authorization": `Bearer ${SUPABASE_RUAS_PUBLISHABLE_KEY}`,
                "Accept": "application/json"
            }
        });

        const textoResposta = await resposta.text();
        let dados = null;
        try {
            dados = textoResposta ? JSON.parse(textoResposta) : null;
        } catch (_) {
            dados = null;
        }

        if (!resposta.ok) {
            const detalhe = (dados && (dados.message || dados.error_description || dados.hint || dados.error)) || textoResposta || `HTTP ${resposta.status}`;
            throw new Error(`Banco de ruas (${resposta.status}): ${detalhe}`);
        }

        if (!Array.isArray(dados)) {
            mostrarSugestoesRuas([]);
            return;
        }

        // Ordena as sugestões pela maior correspondência.
        const termoN = normalizar(termo);
        dados.sort((a, b) => {
            const aNome = normalizar(a["NOME COMPLETO"] || montarEndereco(a));
            const bNome = normalizar(b["NOME COMPLETO"] || montarEndereco(b));
            const aComeca = aNome.startsWith(termoN) ? 0 : 1;
            const bComeca = bNome.startsWith(termoN) ? 0 : 1;
            return aComeca - bComeca || aNome.localeCompare(bNome, "pt-BR");
        });

        ruas = dados;
        mostrarSugestoesRuas(dados);
    } catch (erro) {
        console.error("Erro ao buscar ruas no Banco 2:", erro);
        limparListaRuas();
        lista.innerHTML = `<div style="color:#b00020;cursor:default;">${escaparHtml(erro.message)}</div>`;
    }
}

input.addEventListener("input", () => {
    const valor = input.value.trim();
    ruaSelecionada = null;
    bairro.value = "";
    ultimaBuscaRuas = "";
    clearTimeout(buscaRuasTimer);

    if (!valor) {
        limparListaRuas();
        return;
    }

    buscaRuasTimer = setTimeout(() => buscarRuasNoBanco(valor), 250);
});

input.addEventListener("focus", () => {
    if (input.value.trim()) {
        ultimaBuscaRuas = "";
        buscarRuasNoBanco(input.value.trim());
    }
});

input.addEventListener("blur", () => {
    setTimeout(() => {
        const digitado = normalizar(input.value.trim());
        if (digitado && ruas.length) {
            const encontrada = ruas.find(r => normalizar(montarEndereco(r)) === digitado || normalizar(r["NOME COMPLETO"]) === digitado);
            if (encontrada) selecionarRua(encontrada);
        }
        limparListaRuas();
    }, 180);
});

document.addEventListener("click", event => {
    if (!event.target.closest(".autocomplete")) limparListaRuas();
});

// =========================
// BANCO 1 - SUPABASE
// ordens_servico
// =========================
const SUPABASE_URL = "https://kfjjngcncrqcezyyumvi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tHdykHZugn2CzR3ago9bKg__KsZafC6";

// =========================
// BANCO 2 - SUPABASE
// ruas
// =========================
const SUPABASE_RUAS_URL = "https://ypykiczrahhjepwojaim.supabase.co";
const SUPABASE_RUAS_PUBLISHABLE_KEY = "sb_publishable_7cjD1eDSihnnTR70q-3Ytg_diHgiKMy";

let registros = [];
let editandoId = null;

function headersBanco() {
    return {
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Content-Type": "application/json",
        "Accept": "application/json",
        "Prefer": "return=representation"
    };
}

async function apiBanco(endpoint, options = {}) {
    const url = `${SUPABASE_URL}/rest/v1/${endpoint}`;

    try {
        const resposta = await fetch(url, {
            ...options,
            mode: "cors",
            credentials: "omit",
            headers: { ...headersBanco(), ...(options.headers || {}) }
        });

        const texto = await resposta.text();
        let dados = null;

        try {
            dados = texto ? JSON.parse(texto) : null;
        } catch (_) {
            dados = texto || null;
        }

        if (!resposta.ok) {
            const msg =
                (dados && typeof dados === "object" && (
                    dados.message ||
                    dados.error_description ||
                    dados.hint ||
                    dados.error
                )) ||
                (typeof dados === "string" ? dados : "") ||
                `HTTP ${resposta.status}`;

            throw new Error(`Supabase ${resposta.status}: ${msg}`);
        }

        return dados;
    } catch (erro) {
        if (erro instanceof TypeError) {
            throw new Error(
                "Não foi possível conectar ao Supabase pelo GitHub Pages. " +
                "Verifique a URL do projeto, a chave Publishable e as configurações de acesso do Supabase."
            );
        }
        throw erro;
    }
}

function numeroBanco(valor) {
    if (valor === null || valor === undefined || valor === "") return 0;

    if (typeof valor === "number") {
        return Number.isFinite(valor) ? valor : 0;
    }

    let s = String(valor).trim();
    if (!s) return 0;

    s = s.replace(/\s/g, "");

    if (s.includes(",") && s.includes(".")) {
        s = s.replace(/\./g, "").replace(",", ".");
    } else if (s.includes(",")) {
        s = s.replace(",", ".");
    }

    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
}

function registroParaBanco(r) {
    const pav = obterPavimentosDoEndereco(r.rua);

    const terra = numeroBanco(pav?.terra);
    const bloquete = numeroBanco(pav?.bloquete);
    const paralelepipedo = numeroBanco(pav?.paralelepipedo);
    const asfalto = numeroBanco(pav?.asfalto);

    const valoresPavimento = [terra, bloquete, paralelepipedo, asfalto];
    const totalPavimento = valoresPavimento.reduce((soma, valor) => soma + valor, 0);
    const quantidadeTiposPavimento = valoresPavimento.filter(valor => valor > 0).length;

    return {
        os: String(r.os || "").trim(),
        oficio: r.oficio || "",
        data_solicitacao: r.data || null,
        solicitante: r.solicitante || "",
        contato: r.contato || "",
        endereco: r.rua || "",
        numero: r.numero || "",
        bairro: r.bairro || "",
        origem: r.origem || "",
        tipo: r.tipo || "",
        responsavel: r.responsavel || "",
        equipamento: r.equipamento || "",
        inicio: r.inicio || null,
        fim: r.fim || null,
        descricao: r.descricao || "",
        terra: terra,
        bloquete: bloquete,
        paralelepipedo: paralelepipedo,
        asfalto: asfalto,
        total_pavimento: numeroBanco(totalPavimento),
        quantidade_tipos_pavimento: quantidadeTiposPavimento
    };
}

function bancoParaRegistro(r) {
    return {
        id: r.id,
        os: r.os || "",
        oficio: r.oficio || "",
        data: r.data_solicitacao || "",
        solicitante: r.solicitante || "",
        contato: r.contato || "",
        rua: r.endereco || "",
        numero: r.numero || "",
        bairro: r.bairro || "",
        origem: r.origem || "",
        tipo: r.tipo || "",
        responsavel: r.responsavel || "",
        equipamento: r.equipamento || "",
        inicio: r.inicio || "",
        fim: r.fim || "",
        descricao: r.descricao || ""
    };
}

async function carregarRegistros(silencioso = false) {
    try {
        let todas = [];
        let offset = 0;
        const limite = 1000;

        while (true) {
            const pagina = await apiBanco(`ordens_servico?select=*&order=os.asc&limit=${limite}&offset=${offset}`);
            if (!Array.isArray(pagina)) break;
            todas.push(...pagina);
            if (pagina.length < limite) break;
            offset += limite;
        }

        registros = todas.map(bancoParaRegistro);
        atualizar();
        const status = document.getElementById("statusBanco");
        if (status) status.textContent = `${registros.length} OS no banco online • ${ruas.length} ruas`;
    } catch (erro) {
        console.error("Erro ao consultar ordens_servico no Supabase:", erro);
        const status = document.getElementById("statusBanco");
        if (status) status.textContent = "ERRO AO LER OS: " + erro.message;
        if (!silencioso) alert("Não foi possível consultar as ordens de serviço no Supabase.\\n\\n" + erro.message + "\\n\\nVerifique também a política SELECT da tabela ordens_servico (RLS).");
    }
}

// REFERÊNCIAS DOS CAMPOS
const campoOS = document.getElementById("os");
const campoOficio = document.getElementById("oficio");
const campoData = document.getElementById("data");
const campoSolicitante = document.getElementById("solicitante");
const campoContato = document.getElementById("contato");
const campoNumero = document.getElementById("numero");
const campoOrigem = document.getElementById("origem");
const campoTipo = document.getElementById("tipo");
const campoResponsavel = document.getElementById("responsavel");
const campoEquipamento = document.getElementById("equipamento");
const campoInicio = document.getElementById("inicio");
const campoFim = document.getElementById("fim");
const campoDescricao = document.getElementById("descricao");

function lerFormulario() {
    return {
        os: campoOS.value.trim(),
        oficio: campoOficio.value.trim(),
        data: campoData.value,
        solicitante: campoSolicitante.value.trim(),
        contato: campoContato.value.trim(),
        rua: document.getElementById("rua").value.trim(),
        numero: campoNumero.value.trim(),
        bairro: document.getElementById("bairro").value.trim(),
        origem: campoOrigem.value,
        tipo: campoTipo.value,
        responsavel: campoResponsavel.value.trim(),
        equipamento: campoEquipamento.value.trim(),
        inicio: campoInicio.value,
        fim: campoFim.value,
        descricao: campoDescricao.value.trim()
    };
}

async function salvar() {
    const dado = lerFormulario();
    if (!dado.os) { alert("Informe o Nº da OS."); campoOS.focus(); return; }
    if (!dado.tipo) { alert("Selecione o Tipo de Serviço."); campoTipo.focus(); return; }

    try {
        const payload = registroParaBanco(dado);
        const resultado = await apiBanco("ordens_servico", {
            method: "POST",
            body: JSON.stringify(payload)
        });
        const salvo = Array.isArray(resultado) ? resultado[0] : resultado;
        if (salvo) registros.push(bancoParaRegistro(salvo));
        else await carregarRegistros(true);
        limparFormulario();
        atualizar();
        alert(`OS ${dado.os} salva no banco online.`);
    } catch (erro) {
        console.error(erro);
        alert("Não foi possível salvar a OS.\n\n" + erro.message);
    }
}

async function atualizar() {
    const tbody = document.querySelector("#tabela tbody");
    tbody.innerHTML = "";

    registros.forEach((r) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${escaparHtml(r.os)}</td>
            <td>${escaparHtml(r.oficio)}</td>
            <td>${escaparHtml(r.data)}</td>
            <td>${escaparHtml(r.solicitante)}</td>
            <td>${escaparHtml(r.rua)}</td>
            <td>${escaparHtml(r.numero)}</td>
            <td>${escaparHtml(r.bairro)}</td>
            <td>
                <button type="button" onclick="editarRegistro('${String(r.id || "").replace(/'/g,"")}')">✏️</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

async function editarRegistro(id) {
    const r = registros.find(x => String(x.id) === String(id));
    if (!r) return;

    campoOS.value = r.os;
    campoOficio.value = r.oficio;
    campoData.value = r.data;
    campoSolicitante.value = r.solicitante;
    campoContato.value = r.contato;
    document.getElementById("rua").value = r.rua;
    campoNumero.value = r.numero;
    document.getElementById("bairro").value = r.bairro;
    campoOrigem.value = r.origem;
    campoTipo.value = r.tipo;
    campoResponsavel.value = r.responsavel;
    campoEquipamento.value = r.equipamento;
    campoInicio.value = r.inicio;
    campoFim.value = r.fim;
    campoDescricao.value = r.descricao;

    const encontrada = ruas.find(x => normalizar(montarEndereco(x)) === normalizar(r.rua));
    if (encontrada) ruaSelecionada = encontrada;

    editandoId = id;
    const botao = document.querySelector('button[onclick="salvar()"]');
    if (botao) botao.textContent = "Atualizar";
    window.scrollTo({top:0, behavior:"smooth"});
}

function removerRegistro(id) {
    alert("A exclusão de OS pelo cadastro está desativada para proteger os dados do banco online.");
}

function apagarUltimo() {
    alert("A exclusão de OS pelo cadastro está desativada. Use apenas o botão Limpar para limpar o formulário.");
}

// IMPORTANTE: LimparFormulario() atua SOMENTE nos campos da tela.
// Não faz DELETE, PATCH ou qualquer alteração no Supabase.
// Os registros já salvos no banco permanecem intactos.
function limparFormulario() {
    [campoOS,campoOficio,campoData,campoSolicitante,campoContato,campoNumero,
     campoResponsavel,campoEquipamento,campoInicio,campoFim,campoDescricao].forEach(c => c.value = "");
    campoOrigem.value = "";
    campoTipo.value = "";
    document.getElementById("rua").value = "";
    document.getElementById("bairro").value = "";
    ruaSelecionada = null;
    editandoId = null;
    const botao = document.querySelector('button[onclick="salvar()"]');
    if (botao) botao.textContent = "Salvar";
}

// Se clicar em salvar enquanto estiver editando, transforma o botão em atualização.
const salvarOriginal = salvar;
async function salvarComEdicao() {
    if (!editandoId) return salvarOriginal();
    const dado = lerFormulario();
    if (!dado.os) { alert("Informe o Nº da OS."); return; }

    try {
        await apiBanco(`ordens_servico?id=eq.${encodeURIComponent(editandoId)}`, {
            method: "PATCH",
            body: JSON.stringify(registroParaBanco(dado))
        });
        await carregarRegistros(true);
        limparFormulario();
        alert(`OS ${dado.os} atualizada.`);
    } catch (erro) {
        alert("Não foi possível atualizar.\n\n" + erro.message);
    }
}
window.salvar = salvarComEdicao;

// EXPORTAR EXCEL
function valorNumerico(valor) {
    if (valor === null || valor === undefined || valor === "") return 0;
    const texto = String(valor).trim().replace(/\./g, "").replace(",", ".");
    const numero = Number(texto);
    return Number.isFinite(numero) ? numero : 0;
}

function formatarMetragem(valor) {
    if (!valor) return "";
    return Number.isInteger(valor)
        ? String(valor)
        : String(Number(valor.toFixed(2))).replace(".", ",");
}

function obterPavimentosDoEndereco(endereco) {
    const enderecoNormalizado = normalizar(endereco);
    let rua = ruaSelecionada;

    if (!rua || normalizar(montarEndereco(rua)) !== enderecoNormalizado) {
        rua = ruas.find(r => normalizar(montarEndereco(r)) === enderecoNormalizado);
    }
    if (!rua) {
        rua = ruas.find(r => {
            const completo = normalizar(montarEndereco(r));
            return completo && (enderecoNormalizado.includes(completo) || completo.includes(enderecoNormalizado));
        });
    }
    if (!rua) return {terra:0,bloquete:0,paralelepipedo:0,asfalto:0,total:0,quantidadeTipos:0};

    const terra = valorNumerico(rua["TERRA"]);
    const bloquete = valorNumerico(rua["BLOQUETE"]);
    const paralelepipedo = valorNumerico(rua["PARALELEPÍPEDO"]);
    const asfalto = valorNumerico(rua["ASFALTO"]);
    const valores = [terra,bloquete,paralelepipedo,asfalto];
    const quantidadeTipos = valores.filter(v => v > 0).length;
    const soma = valores.reduce((a,b) => a+b,0);

    return {
        terra,bloquete,paralelepipedo,asfalto,
        total: quantidadeTipos > 1 ? soma : 0,
        quantidadeTipos
    };
}

function exportarExcel() {
    if (!registros.length) { alert("Não há ordens de serviço para exportar."); return; }
    if (typeof XLSX === "undefined") { alert("A biblioteca de Excel não foi carregada."); return; }

    const dados = registros.map(r => {
        const pav = obterPavimentosDoEndereco(r.rua || "");
        return {
            "Os":r.os||"", "Oficio":r.oficio||"", "Data":r.data||"",
            "Solicitante":r.solicitante||"", "Contato":r.contato||"",
            "Endereco":r.rua||"", "Numero":r.numero||"", "Bairro":r.bairro||"",
            "Origem":r.origem||"", "Tipo":r.tipo||"", "Responsavel":r.responsavel||"",
            "Equipamento":r.equipamento||"", "Inicio":r.inicio||"", "Fim":r.fim||"",
            "Descricao":r.descricao||"",
            "Terra":formatarMetragem(pav.terra), "Bloquete":formatarMetragem(pav.bloquete),
            "Paralelepípedo":formatarMetragem(pav.paralelepipedo),
            "Asfalto":formatarMetragem(pav.asfalto), "Total":formatarMetragem(pav.total)
        };
    });
    const ws = XLSX.utils.json_to_sheet(dados);
    ws["!cols"] = [
        {wch:12},{wch:14},{wch:12},{wch:25},{wch:18},{wch:45},{wch:10},{wch:24},
        {wch:18},{wch:30},{wch:24},{wch:20},{wch:12},{wch:12},{wch:50},
        {wch:12},{wch:12},{wch:18},{wch:12},{wch:12}
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Ordens de Serviço");
    XLSX.writeFile(wb, "ordens_de_servico.xlsx");
}

setInterval(() => carregarRegistros(true), 10000);
