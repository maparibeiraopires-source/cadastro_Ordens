<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cadastro online de Ordens de Serviço da Zeladoria">
<title>Ordem de Serviço - Zeladoria</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
@page { size:A4; margin:10mm; }

body{
    font-family:'Montserrat',sans-serif;
    margin:0;
    background:#eee;
}
.github-nav{
    width:190mm;
    margin:12px auto;
    display:flex;
    gap:8px;
    justify-content:flex-end;
}
.github-nav a{
    text-decoration:none;
    padding:7px 11px;
    border-radius:7px;
    background:#173d2b;
    color:#fff;
    font-size:11px;
    font-weight:700;
}
.github-nav a.ativo{background:#21633f;}
@media(max-width:800px){
    .github-nav{width:auto;margin:10px 14px;justify-content:flex-start;flex-wrap:wrap;}
    .folha,.acoes,.tabela-container{width:auto;margin-left:14px;margin-right:14px;}
}

.folha{ width:190mm; margin:auto; }

.container{
    min-height:135mm;
    background:#fff;
    padding:10px;
    border:1px solid #ccc;
    margin-bottom:10px;
}
.header{
    width:100%;
    text-align:center;
    margin-bottom:10px;
    overflow:hidden;
}

.logo{
    display:block;
    width:100%;
    max-width:100%;
    height:auto;
    margin:0 auto;
}
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.linha-topo{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; }
.linha-solicitante{ display:grid; grid-template-columns:2fr 1fr; gap:5px; }
.linha-3{ display:grid; grid-template-columns:3fr 0.6fr 1fr; gap:5px; }

.campo{ display:flex; flex-direction:column; }

.campo label{
    font-size:9px;
    font-weight:600;
    text-transform:uppercase;
}

.campo input,
.campo select,
.campo textarea{
    border:1px solid #999;
    padding:5px;
    font-size:11px;
    background:#fafafa;
    font-family:'Montserrat';
    width:100%;
    box-sizing:border-box;
}

textarea{ resize:none; }

/* AUTOCOMPLETE */
.autocomplete{ position:relative; }

.lista{
    position:absolute;
    background:#fff;
    border:1px solid #ccc;
    width:100%;
    max-height:120px;
    overflow-y:auto;
    z-index:999;
}

.lista div{ padding:5px; cursor:pointer; }
.lista div:hover{ background:#eee; }

/* AÇÕES */
.acoes{
    width:190mm;
    margin:10px auto;
    text-align:right;
}

.acoes button{
    padding:6px 10px;
    font-size:11px;
    margin-left:5px;
}

/* TABELA */
.tabela-container{
    width:190mm;
    margin:auto;
}

#tabela{
    width:100%;
    border-collapse:collapse;
    font-size:11px;
}

#tabela th,#tabela td{
    border:1px solid #999;
    padding:4px;
}

/* PRINT */
@media print{
    body{background:#fff;}
}
</style>
</head>

<body>

<div class="github-nav">
    <a href="index.html">📊 Dashboard</a>
    <a href="cadastro.html" class="ativo">📝 Cadastro de OS</a>
</div>

<div class="folha">

<div class="container">

<div class="header">
    <img src="logo zeladoria.png" class="logo" alt="Zeladoria"
         onerror="this.style.display='none';">
</div>

<div class="grid">

<!-- TOPO -->
<div class="linha-topo" style="grid-column:1/-1;">
    <div class="campo">
        <label>Nº OS</label>
        <input id="os" readonly placeholder="Gerada automaticamente">
    </div>

    <div class="campo">
        <label>Nº Ofício/Ouvidoria</label>
        <input id="oficio">
    </div>

    <div class="campo">
        <label>Data Solicitação</label>
        <input id="data" type="date">
    </div>
</div>

<!-- SOLICITANTE -->
<div class="linha-solicitante" style="grid-column:1/-1;">
    <div class="campo">
        <label>Solicitante</label>
        <input id="solicitante">
    </div>

    <div class="campo">
        <label>Contato</label>
        <input id="contato">
    </div>
</div>

<!-- ENDEREÇO -->
<div class="linha-3" style="grid-column:1/-1;">

    <div class="campo autocomplete">
        <label>Endereço</label>
        <input id="rua">
        <div id="lista" class="lista"></div>
    </div>

    <div class="campo">
        <label>Nº</label>
        <input id="numero">
    </div>

    <div class="campo">
        <label>Bairro</label>
        <input id="bairro" readonly>
    </div>

</div>

<!-- ORIGEM + TIPO -->
<div class="linha-solicitante" style="grid-column:1/-1;">
    <div class="campo">
        <label>Origem</label>
        <select id="origem">
                <option value="">Selecione...</option>
                <option>1- Telefônica </option>
                <option>2- Aplicativo</option>
                <option>3- Presencial</option>
                <option>4- Ouvidoria </option>
                <option>5 - Gabinete </option>
                <option>6 - Outras Secretarias </option>
                <option>7 - Ofício Vereadores/ Secretarias </option>
                <option>8 -Interna </option>
                <option>9 -E-mail </option>
        </select>
    </div>

    <div class="campo">
        <label>Tipo de Serviço</label>
        <select id="tipo">
           <option value="">Selecione...</option>
                <option>1 - Capinação</option>
                <option>2 - Cata Bagulho</option>
                <option>3 - Poda de Árvores</option>
                <option>4 - Recolha de Capinação</option>
                <option>5 - Descarte Irregular</option>
                <option>6 - Drenagem</option>
                <option>7 - Desassoreamento</option>
                <option>8 - Limpeza de Boca de Lobo / Boca de Leão</option>
                <option>9 - Troca de Tampa / Reparo de Gradil</option>
                <option>10 - Tapa Buraco</option>
                <option>11 - Manutenção/Reparo em Vias</option>
                <option>12 - Nivelamento</option>
                <option>13 - Construção</option>
                <option>14 - Remoção de Árvores</option>
                <option>15 - Manutenção/Limpeza de Mobiliário Urbano</option>
                <option>16 - Iluminação Pública</option>
                <option>17 - Manutenção em Ponto de Ônibus</option>
                <option>18 - Remoção de Ponto de Ônibus</option>
                <option>19 - Caminhão Pipas</option>
                <option>20 - Caiação</option>
                <option>21 - Fiscalização</option>
                <option>22 - Varrição de rua</option>

        </select>
    </div>
</div>

<!-- RESPONSÁVEL + EQUIPAMENTO -->
<div class="linha-solicitante" style="grid-column:1/-1;">
    <div class="campo">
        <label>Responsável</label>
        <input id="responsavel">
    </div>

    <div class="campo">
        <label>Equipamento</label>
        <input id="equipamento">
    </div>
</div>

<!-- DATAS -->
<div class="linha-solicitante" style="grid-column:1/-1;">
    <div class="campo">
        <label>Data de Início</label>
        <input id="inicio" type="date">
    </div>

    <div class="campo">
        <label>Data de Término</label>
        <input id="fim" type="date">
    </div>
</div>

<!-- DESCRIÇÃO -->
<div class="campo" style="grid-column:1/-1;">
    <label>Descrição do Serviço</label>
    <textarea id="descricao" rows="3"></textarea>
</div>

</div>
</div>

<!-- BOTÕES -->
<div class="acoes">
    <button onclick="salvar()">Salvar</button>
     <button onclick="limparFormulario()">Limpar</button>
    <button onclick="apagarUltimo()">Apagar Último</button>
    <button onclick="exportarExcel()">Exportar Excel</button>
</div>

<!-- TABELA -->
<div class="tabela-container">
<table id="tabela">
<thead>
<tr>
<th>OS</th><th>Ofício</th><th>Data</th><th>Solicitante</th>
<th>Endereço</th><th>Nº</th><th>Bairro</th><th>Ação</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

// Monta o endereço exibido no formulário: TIPO + COMPLEMENTO DO NOME + NOME.
function montarEndereco(rua) {
    return [rua.TIPO, rua["COMPLEMENTO DO NOME"], rua.NOME]
        .filter(valor => valor !== null && valor !== undefined && String(valor).trim() !== "")
        .map(valor => String(valor).trim())
        .join(" ");
}

function normalizar(texto) {
    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

function escaparHtml(texto) {
    return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

const input = document.getElementById("rua");
const lista = document.getElementById("lista");
const bairro = document.getElementById("bairro");
let ruaSelecionada = null;

input.addEventListener("input", () => {
    const valor = normalizar(input.value.trim());
    lista.innerHTML = "";
    ruaSelecionada = null;

    if (valor.length < 1) {
        bairro.value = "";
        return;
    }

    const resultados = ruas
        .map((r, indice) => ({ rua: r, indice, endereco: montarEndereco(r) }))
        .filter(item => normalizar(item.endereco).includes(valor))
        .slice(0, 12);

    resultados.forEach(item => {
        const div = document.createElement("div");
        div.innerHTML = `<strong>${escaparHtml(item.endereco)}</strong><br><small>${escaparHtml(item.rua.BAIRRO || "Bairro não informado")}</small>`;

        div.addEventListener("mousedown", event => {
            event.preventDefault();
            input.value = item.endereco;
            bairro.value = item.rua.BAIRRO || "";
            ruaSelecionada = item.rua;
            lista.innerHTML = "";
        });
        lista.appendChild(div);
    });
});

input.addEventListener("focus", () => {
    if (input.value.trim()) input.dispatchEvent(new Event("input"));
});

input.addEventListener("blur", () => {
    setTimeout(() => {
        const digitado = normalizar(input.value.trim());
        if (!digitado) return;
        const encontrado = ruas.find(r => normalizar(montarEndereco(r)) === digitado);
        if (encontrado) {
            input.value = montarEndereco(encontrado);
            bairro.value = encontrado.BAIRRO || "";
            ruaSelecionada = encontrado;
        }
        lista.innerHTML = "";
    }, 120);
});

    if (!event.target.closest(".autocomplete")) lista.innerHTML = "";
});

const SUPABASE_URL = "https://kfjjngcncrqcezyyumvi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tHdykHZugn2CzR3ago9bKg__KsZafC6";

let registros = [];
let editandoId = null;

function headersBanco() {
    return {
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization": `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
    };
}

async function apiBanco(endpoint, options = {}) {
    const resposta = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
        ...options,
        headers: { ...headersBanco(), ...(options.headers || {}) }
    });
    const texto = await resposta.text();
    let dados = null;
    try { dados = texto ? JSON.parse(texto) : null; } catch (_) {}
    if (!resposta.ok) {
        const msg = dados?.message || dados?.error_description || dados?.hint || texto || `HTTP ${resposta.status}`;
        throw new Error(msg);
    }
    return dados;
}

function valorNumerico(valor) {
    if (valor === null || valor === undefined || valor === "") return 0;
    const texto = String(valor).trim().replace(/\./g, "").replace(",", ".");
    const numero = Number(texto);
    return Number.isFinite(numero) ? numero : 0;
}

function obterPavimentosDoEndereco(endereco) {
    const enderecoNormalizado = normalizar(endereco);
    let rua = ruaSelecionada;

    if (!rua || normalizar(montarEndereco(rua)) !== enderecoNormalizado) {
        rua = ruas.find(r => normalizar(montarEndereco(r)) === enderecoNormalizado);
    }

    if (!rua) {
        rua = ruas.find(r => {
            const completo = normalizar(montarEndereco(r));
            return completo && (enderecoNormalizado.includes(completo) || completo.includes(enderecoNormalizado));
        });
    }

    if (!rua) {
        return {
            terra: 0,
            bloquete: 0,
            paralelepipedo: 0,
            asfalto: 0,
            total: 0,
            quantidadeTipos: 0
        };
    }

    const terra = valorNumerico(rua.TERRA);
    const bloquete = valorNumerico(rua.BLOQUETE);
    const paralelepipedo = valorNumerico(rua.PARALELEPÍPEDO);
    const asfalto = valorNumerico(rua.ASFALTO);
    const valores = [terra, bloquete, paralelepipedo, asfalto];
    const quantidadeTipos = valores.filter(v => v > 0).length;
    const soma = valores.reduce((a, b) => a + b, 0);

    return {
        terra,
        bloquete,
        paralelepipedo,
        asfalto,
        total: quantidadeTipos > 1 ? soma : 0,
        quantidadeTipos
    };
}

function registroParaBanco(r) {
    const pav = obterPavimentosDoEndereco(r.rua || "");
    return {
        os: String(r.os || "").trim(),
        oficio: r.oficio || "",
        data_solicitacao: r.data || null,
        solicitante: r.solicitante || "",
        contato: r.contato || "",
        endereco: r.rua || "",
        numero: r.numero || "",
        bairro: r.bairro || "",
        origem: r.origem || "",
        tipo: r.tipo || "",
        responsavel: r.responsavel || "",
        equipamento: r.equipamento || "",
        inicio: r.inicio || null,
        fim: r.fim || null,
        descricao: r.descricao || "",
        terra: pav.terra || 0,
        bloquete: pav.bloquete || 0,
        paralelepipedo: pav.paralelepipedo || 0,
        asfalto: pav.asfalto || 0,
        total_pavimento: pav.total || 0,
        quantidade_tipos_pavimento: pav.quantidadeTipos || 0
    };
}

function bancoParaRegistro(r) {
    return {
        id: r.id,
        os: r.os || "",
        oficio: r.oficio || "",
        data: r.data_solicitacao || "",
        solicitante: r.solicitante || "",

        numero: r.numero || "",
        bairro: r.bairro || "",
        origem: r.origem || "",
        tipo: r.tipo || "",
        responsavel: r.responsavel || "",
        equipamento: r.equipamento || "",
        inicio: r.inicio || "",
        fim: r.fim || "",
        descricao: r.descricao || ""
    };
}

async function carregarRegistros(silencioso = false) {
    try {
        const dados = await apiBanco("ordens_servico?select=*&order=os.asc");
        registros = Array.isArray(dados) ? dados.map(bancoParaRegistro) : [];
        atualizar();
        if (!silencioso) {
            const status = document.getElementById("statusBanco");
            if (status) status.textContent = `${registros.length} OS no banco online`;
        }
    } catch (erro) {
        console.error("Erro ao consultar Supabase:", erro);
        const status = document.getElementById("statusBanco");
        if (status) status.textContent = "Erro no banco: " + erro.message;
        if (!silencioso) alert("Não foi possível consultar o banco online.\n\n" + erro.message);
    }
}

const campoContato = document.getElementById("contato");
const campoNumero = document.getElementById("numero");
const campoOrigem = document.getElementById("origem");
const campoTipo = document.getElementById("tipo");
const campoResponsavel = document.getElementById("responsavel");
const campoEquipamento = document.getElementById("equipamento");
const campoInicio = document.getElementById("inicio");
const campoFim = document.getElementById("fim");
const campoDescricao = document.getElementById("descricao");

function lerFormulario() {
    return {
        os: campoOS.value.trim(),
        oficio: campoOficio.value.trim(),
        data: campoData.value,
        solicitante: campoSolicitante.value.trim(),
        contato: campoContato.value.trim(),
        rua: document.getElementById("rua").value.trim(),
        numero: campoNumero.value.trim(),

        responsavel: campoResponsavel.value.trim(),
        equipamento: campoEquipamento.value.trim(),
        inicio: campoInicio.value,
        fim: campoFim.value,
        descricao: campoDescricao.value.trim()
    };
}

async function salvar() {
    const dado = lerFormulario();
    if (!dado.tipo) { alert("Selecione o Tipo de Serviço."); campoTipo.focus(); return; }

    if (!editandoId) {
        try {
            const existentes = await apiBanco("ordens_servico?select=os&order=os.desc&limit=1000");
            const numeros = (Array.isArray(existentes) ? existentes : [])
                .map(r => Number(String(r.os ?? "").replace(/[^0-9]/g, "")))
                .filter(Number.isFinite);
            dado.os = String(numeros.length ? Math.max(...numeros) + 1 : 1);
            campoOS.value = dado.os;
        } catch (erro) {
            alert("Não foi possível gerar o próximo número da OS.\n\n" + erro.message);
            return;
        }
    }

    try {
        const payload = registroParaBanco(dado);
        const resultado = await apiBanco("ordens_servico", {
            method: "POST",
            body: JSON.stringify(payload)
        });
        const salvo = Array.isArray(resultado) ? resultado[0] : resultado;
        if (salvo) registros.push(bancoParaRegistro(salvo));
        else await carregarRegistros(true);
        limparFormulario();
        atualizar();
        alert(`OS ${dado.os} salva no banco online.`);
    } catch (erro) {
        console.error(erro);
        alert("Não foi possível salvar a OS.\n\n" + erro.message);
    }
}

async function atualizar() {
    const tbody = document.querySelector("#tabela tbody");
    tbody.innerHTML = "";

    registros.forEach((r) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${escaparHtml(r.os)}</td>
            <td>${escaparHtml(r.oficio)}</td>
            <td>${escaparHtml(r.data)}</td>
            <td>${escaparHtml(r.solicitante)}</td>
            <td>${escaparHtml(r.rua)}</td>

                <button type="button" onclick="editarRegistro('${String(r.id || "").replace(/'/g,"")}')">✏️</button>
                <button type="button" onclick="removerRegistro('${String(r.id || "").replace(/'/g,"")}')">🗑</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

async function editarRegistro(id) {
    const r = registros.find(x => String(x.id) === String(id));
    if (!r) return;

    campoOS.value = r.os;
    campoOficio.value = r.oficio;
    campoData.value = r.data;
    campoSolicitante.value = r.solicitante;
    campoContato.value = r.contato;
    document.getElementById("rua").value = r.rua;
    campoNumero.value = r.numero;
    document.getElementById("bairro").value = r.bairro;
    campoOrigem.value = r.origem;
    campoTipo.value = r.tipo;
    campoResponsavel.value = r.responsavel;
    campoEquipamento.value = r.equipamento;
    campoInicio.value = r.inicio;
    campoFim.value = r.fim;
    campoDescricao.value = r.descricao;

    const encontrada = ruas.find(x => normalizar(montarEndereco(x)) === normalizar(r.rua));
    if (encontrada) ruaSelecionada = encontrada;

    editandoId = id;
    const botao = document.querySelector('button[onclick="salvar()"]');
    if (botao) botao.textContent = "Atualizar";
    window.scrollTo({top:0, behavior:"smooth"});
}

async function removerRegistro(id) {
    const r = registros.find(x => String(x.id) === String(id));
    if (!r) return;
    if (!confirm(`Excluir definitivamente a OS ${r.os} do banco online?`)) return;

    try {
        await apiBanco(`ordens_servico?id=eq.${encodeURIComponent(id)}`, { method: "DELETE" });
        await carregarRegistros(true);
    } catch (erro) {
        alert("Não foi possível excluir.\n\n" + erro.message);
    }
}

async function apagarUltimo() {
    if (!registros.length) { alert("Não há ordens de serviço."); return; }
    const ultimo = registros[registros.length - 1];
    if (!confirm(`Excluir a última OS (${ultimo.os}) do banco online?`)) return;
    await removerRegistro(ultimo.id);
}

function limparFormulario() {
    [campoOS,campoOficio,campoData,campoSolicitante,campoContato,campoNumero,
     campoResponsavel,campoEquipamento,campoInicio,campoFim,campoDescricao].forEach(c => c.value = "");

}
